# The reference 8 GB configuration. See docs/RUNBOOK-8GB.md for the hardware and
# the measured/projected split. Trains on a single rented 24 GB card, runs on 8 GB.
name: 8gb
out_dir: runs/8gb
device: auto
seed: 0

frames: 16
size: 256
batch_size: 1
dataset_size: 200000

vae_steps: 60000
vae_lr: 2.0e-4

dit_steps: 120000
dit_lr: 2.0e-4
text_lr: 2.0e-4
text_loss_weight: 0.02

log_every: 100
save_every: 2000
grad_clip: 1.0
preview_every: 2000

dit:
  latent_channels: 16
  patch_size: 2
  hidden_size: 768
  depth: 24
  num_heads: 12
  mlp_ratio: 4.0
  text_dim: 512
  max_text_len: 77
  qk_norm: true

vae:
  in_channels: 3
  base_channels: 48
  latent_channels: 16
  channel_multipliers: [1, 2, 3, 4, 4, 4]
  num_res_blocks: 2
  spatial_compression: 8
  temporal_compression: 4
  groups: 8

text:
  vocab_size: 256
  width: 512
  layers: 6
  heads: 8
  max_len: 77
